 [project]
name = "fastapi-sosiski"
version = "0.1.0"
description = "Async FastAPI backend with Gemini AI integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",       
    "alembic>=1.13.0",       
    "pydantic-settings>=2.5.0", 
    "google-genai>=0.1.0",   
    "python-dotenv>=1.0.0",  
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0", 
    "httpx>=0.27.0",          
    "ruff>=0.6.0",            
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"